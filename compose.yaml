services:
  game:
    # `docker compose pull` fetches the published image; `up --build` builds it locally instead.
    image: ghcr.io/markotranda/island-table:${IMAGE_TAG:-latest}
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:3000"
    environment:
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - game-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  game-data:
